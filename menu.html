<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to Main Content</a>

    <header>
        <h1>Fast Food Restaurant</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>

    <main id="main">
        <h2>Food Menu & Pricing</h2>
        
        <!-- Grid chứa 5 hình ảnh (đáp ứng Yêu cầu 1, 5, 6, 9) -->
        <div class="grid-container">
            <div class="card">
                <img src="https://via.placeholder.com/200?text=Burger" alt="Burger">
                <h3>Juicy Burger</h3>
                <p>Price: $8.99</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200?text=Fried+Chicken" alt="Fried Chicken">
                <h3>Crispy Chicken</h3>
                <p>Price: $10.00</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200?text=French+Fries" alt="French Fries">
                <h3>Potato Chips</h3>
                <p>Price: $5.00</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200?text=Soft+Drink" alt="Soft Drink">
                <h3>Soft Drink</h3>
                <p>Price: $2.99</p>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200?text=Combo+Meal" alt="Combo Meal">
                <h3>Combo Special</h3>
                <p>Price: $20.00</p>
            </div>
        </div>
